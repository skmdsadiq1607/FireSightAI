services:
  # Node.js Backend Gateway
  - type: web
    name: firesight-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: live
      - key: FIRMS_REGION
        value: india
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Python AI Intelligence Service
  - type: web
    name: firesight-ai-service
    env: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
